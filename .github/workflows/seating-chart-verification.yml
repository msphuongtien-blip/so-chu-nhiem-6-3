name: Seating chart verification

on:
  push:
    branches:
      - main
      - v6/task-1-category-foundation
  pull_request:
    branches:
      - main

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check modules/seating-chart.js
          node tests/core/seating-chart.test.js
