name: V6 Task 1 category wiring

on:
  push:
    branches:
      - v6/task-1-category-foundation

permissions:
  contents: write

jobs:
  wire-category-script:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire V6 competition category layer
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '<script defer src="app.js"></script>'
          new = (
              '<script defer src="app.js"></script>\n'
              '<script defer src="competition-v6-category.js"></script>'
          )

          if 'competition-v6-category.js' not in text:
              text = text.replace(old, new, 1)

          text = text.replace(
              '<option value="5">5. Trách nhiệm – ứng xử</option></select>',
              '</select>',
              1,
          )
          text = text.replace(
              '5 nhóm · điểm cố định -5…-1, +1…+5 · không có 0',
              '6 nhóm · điểm cố định -5…-1, +1…+5 · không có 0',
              1,
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit generated wiring change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'refactor(competition): wire dynamic category layer'
          git push
