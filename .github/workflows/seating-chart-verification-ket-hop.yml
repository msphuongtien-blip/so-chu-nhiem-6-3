name: Seating chart verification

on:
  push:
    branches:
      - feature/seating-chart-ket-hop

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check modules/seating-chart.js
          node tests/core/seating-chart.test.js
      - name: Check integration contract
        run: |
          grep -q 'modules/seating-chart.js' index.html
          grep -q 'seating_positions' modules/seating-chart.js
          grep -q 'random_pick_history' modules/seating-chart.js
